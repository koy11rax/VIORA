name: Source safety and regression checks
on:
  workflow_dispatch:
  push:
    paths: ['apps/**', 'desktop/**', 'third_party/**', 'viora_control/**', 'tests/**', '.github/workflows/audit.yml', 'requirements-test.txt', 'requirements-control.txt']
  pull_request:
    paths: ['apps/**', 'desktop/**', 'third_party/**', 'viora_control/**', 'tests/**', '.github/workflows/audit.yml', 'requirements-test.txt', 'requirements-control.txt']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --require-hashes -r requirements-control.txt
      - run: python -m unittest discover -s tests -v
  tunnel:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop/tunnel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/tunnel/go.sum
      - run: go test ./...
      - run: go vet ./...
  flutter:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact Flutter source revision
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP flutter
          git init $sdk
          git -C $sdk remote add origin https://github.com/flutter/flutter.git
          git -C $sdk fetch --depth=1 origin ac4e799d237041cf905519190471f657b657155a
          git -C $sdk checkout --detach FETCH_HEAD
          "$sdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter analyze --no-pub
        working-directory: apps/client
      - run: flutter test --no-pub
        working-directory: apps/client
