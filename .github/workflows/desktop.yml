name: Desktop UI builds (not VPN installer packages)
on:
  workflow_dispatch:
  push:
    paths: ['apps/client/**', 'scripts/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/client/**', 'scripts/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev liblzma-dev libsecret-1-dev libayatana-appindicator3-dev
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin ac4e799d237041cf905519190471f657b657155a
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter analyze --no-pub
        working-directory: apps/client
      - run: flutter test --no-pub
        working-directory: apps/client
      - run: flutter build linux --release --no-pub
        working-directory: apps/client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Viora-linux-x64-ui-build-only
          path: apps/client/build/linux/x64/release/bundle/
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Flutter SDK
        run: |
          git init "$env:RUNNER_TEMP/flutter"
          git -C "$env:RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$env:RUNNER_TEMP/flutter" fetch --depth 1 origin ac4e799d237041cf905519190471f657b657155a
          git -C "$env:RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Viora-windows-x64-ui-build-only
          path: apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error
